name: build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # tg-notify читает статус шагов через GitHub API
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tg_message_id: ${{ steps.tg.outputs.message_id }}
    steps:
      # первым шагом: дальше статус шагов action берёт из API сам.
      # Имена шагов попадают в сообщение, поэтому у всех шагов есть name
      - id: tg
        uses: qu1nqqy/tg-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}

      - name: Checkout
        uses: actions/checkout@v4

      # версия и компоненты берутся из rust-toolchain.toml
      - name: Install toolchain
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install bootimage
        run: cargo install bootimage --locked

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: make lint

      - name: Run tests
        run: make test

  release:
    needs: test
    # релизы только из master, пуши в dev и PR проходят лишь тесты
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # свой блок permissions заменяет общий целиком, поэтому actions: read повторяется
    permissions:
      contents: write
      actions: read
    steps:
      # дописывает секцию release в сообщение задачи test
      - uses: qu1nqqy/tg-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}
          message_id: ${{ needs.test.outputs.tg_message_id }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install bootimage
        run: cargo install bootimage --locked

      - name: Build debug image
        run: make build

      - name: Build release image
        run: make release

      - name: Collect images
        run: |
          mkdir dist
          cp target/x86-rustos/debug/bootimage-rustos.bin   dist/rustos-debug.bin
          cp target/x86-rustos/release/bootimage-rustos.bin dist/rustos-release.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustos-${{ github.sha }}
          path: dist/*.bin

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "build-${SHORT_SHA}" dist/*.bin \
            --target "$GITHUB_SHA" \
            --title "build ${SHORT_SHA}" \
            --notes "Сборка коммита ${GITHUB_SHA}: $(git log -1 --pretty=%s)

          Запуск: \`qemu-system-x86_64 -drive format=raw,file=rustos-release.bin\`"
          echo "tag=build-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # отдельное сообщение о релизе с образами, закрепляется в теме проекта
      - name: Notify release
        uses: qu1nqqy/tg-notify@v1
        with:
          mode: release
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}
          tag: ${{ steps.publish.outputs.tag }}
          files: dist/*.bin
