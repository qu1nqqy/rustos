[package]
name = "rustos"
version = "0.1.0"
edition = "2024"

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 300

# [profile.dev]
# panic = "abort"

# [profile.release]
# panic = "abort"

[[bin]]
name = "rustos"
test = true
bench = false

[dependencies]
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
volatile = "0.6.1"
spin = "0.12.3"
x86_64 = "0.15.5"
uart_16550 = "0.9.0"
pic8259 = "0.11.0"
pc-keyboard = "0.9.0"
linked_list_allocator = "0.10.6"

[dependencies.lazy_static]
version = "1.5.1"
features = ["spin_no_std"]

[dependencies.crossbeam-queue]
version = "0.3.14"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.4.0"
default-features = false

[dependencies.futures-util]
version = "0.3.34"
default-features = false
features = ["alloc"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "double_fault"
harness = false

[[test]]
name = "heap_oom"
harness = false

[[test]]
name = "executor"
harness = false
